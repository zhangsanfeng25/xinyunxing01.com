<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="发现、收藏与分享。当前为界面演示。"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"><meta name="theme-color" content="#263f45"><title>我的空间</title><link rel="stylesheet" href="css/space.css?v=20261010-stable-background"><script src="js/space.js?v=20261010-stable-background" defer></script></head>
<body><main id="welcome"><div class="wallpaper" aria-hidden="true"></div><header class="landing-nav"><a class="nav-login" href="#login">登录 ↗</a></header><section class="intro screen" id="intro" aria-label="欢迎页"><a class="scroll-cue" href="#login"><span>下滑登录</span><span aria-hidden="true">↓</span></a></section>
<section class="login-screen screen" id="login" aria-labelledby="login-title"><div class="login-card"><h2 id="login-title">欢迎回来</h2><form id="login-form" autocomplete="off"><div class="field"><label for="account">账号</label><input id="account" type="text" required maxlength="80" autocomplete="off" placeholder="请输入账号" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="password">密码</label><div class="password-wrap"><input id="password" type="password" required maxlength="128" autocomplete="new-password" placeholder="请输入密码"><button id="toggle-password" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div></div><button class="primary login-button" id="enter-space" type="submit" disabled>登录 <span aria-hidden="true">→</span></button><p id="login-message" class="form-message" role="status"></p></form><noscript><p>请启用 JavaScript 使用演示。表单不会提交任何内容。</p></noscript></div><a href="#intro" class="back-top">返回首屏 ↑</a></section></main>
<main id="workspace" hidden><header class="workspace-nav"><div class="nav-inner"><a class="workspace-brand" href="#" id="brand-home">我的空间</a><nav aria-label="主导航"><button class="nav-tab active" data-view="home" aria-current="page">首页</button><button class="nav-tab" data-view="content">内容</button></nav><div class="account-area"><span class="mode-chip">演示模式</span><button class="logout" id="logout">退出 ↗</button></div></div></header><div class="workspace-body"><div class="workspace-heading"><div><p class="section-kicker">YOUR SPACE</p><h1 id="page-title" tabindex="-1">首页</h1><p id="page-description">在这里浏览与整理你的内容。</p></div><label class="search-box"><span aria-hidden="true">⌕</span><span class="sr-only">搜索内容</span><input id="search" type="search" placeholder="搜索内容" maxlength="100"></label></div><div class="workspace-notice"><span aria-hidden="true">ⓘ</span><p>界面演示 · 尚未接入数据库和身份验证。临时内容仅在当前页面预览，刷新后清空。请勿添加私密资料。</p></div><section class="content-panel" aria-labelledby="content-title"><div class="panel-header"><div><h2 id="content-title">内容展示</h2><p>文字、图片，以及你想留下的片刻。</p></div><button class="primary add-button" id="add-content">＋ 添加内容</button></div><div class="content-grid" id="content-grid"></div><div class="empty-state" id="empty-state"><div class="empty-icon" aria-hidden="true">＋</div><h3 id="empty-title">让空间从第一份内容开始</h3><p id="empty-description">添加一段文字或一张图片，预览你的内容展示。</p><button class="empty-action" id="empty-add">添加第一份内容 →</button></div><p class="result-status" id="result-status" role="status"></p></section><footer class="workspace-footer"><span>发现 · 收藏 · 分享</span></footer></div></main>
<dialog id="content-dialog" aria-labelledby="dialog-title"><form id="content-form"><div class="dialog-heading"><div><p class="section-kicker">A NEW MOMENT</p><h2 id="dialog-title">添加临时内容</h2></div><button class="close-dialog" id="close-dialog" type="button" aria-label="关闭">×</button></div><p class="dialog-note">仅在当前页面预览，不会上传或保存。刷新后清空。</p><div class="field"><label for="content-name">标题</label><input id="content-name" maxlength="60" required placeholder="给这份内容起个名字"></div><div class="field"><label for="content-text">文字 <span class="optional">可选</span></label><textarea id="content-text" rows="4" maxlength="2000" placeholder="写下想分享的内容…"></textarea></div><p id="content-message" class="form-message" role="status"></p><button class="primary dialog-submit" type="submit">添加到预览 →</button></form></dialog></body></html>
